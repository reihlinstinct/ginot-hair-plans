<h1>קבלת מייל על תוכנית</h1>
<p>בחרו תוכנית בהפקדה וקבלו מייל חד-פעמי עם פרטי התוכנית, המועד האחרון
להגשת התנגדות וקישור לעמוד התוכנית במב"ת. כתובת המייל משמשת לשליחה בלבד
ואינה נשמרת. עודכן: 2026-11-07.</p>
<form id="email-form" method="post" action="#">
<p><label>תוכנית:<br>
<select id="plan" name="plan_number" required><option value="101-1095330">101-1095330 - מתחם רג&#x27;ואן - הסדנא-פייר קניג</option><option value="101-1386671">101-1386671 - התחדשות עירונית - לינקולן 13</option><option value="101-1377753">101-1377753 - התחדשות עירונית הפלמ&quot;ח 49, 51 והשיירות 2</option><option value="101-1348069">101-1348069 - הרחבת יח&quot;ד קיימת ברחוב דוד מרכוס 11, טלביה</option><option value="101-1415090">101-1415090 - בית כנסת חורב</option><option value="101-1488261">101-1488261 - שינוי בקווי בניין מאושרים  מלון ענבל</option><option value="101-1451699">101-1451699 - תכנית איחוד וחלוקה עבור מדרשיית הרטמן לבנות</option><option value="101-1549260">101-1549260 - הסדנא 2 - תוספת שטחים</option><option value="101-1487560">101-1487560 - שינוי קווי בניין לשם שינוי תכנון ללא תוספת שטחים-מבוא יורם 1</option></select></label></p>
<p><label>כתובת מייל:<br>
<input type="email" id="email" name="email" required size="30"
 autocomplete="email" dir="ltr"></label></p>
<p style="display:none" aria-hidden="true"><label>אתר:
<input type="text" id="website" name="website" tabindex="-1"
 autocomplete="off"></label></p>
<p><button type="submit">שלחו לי מייל</button></p>
<p id="form-status" role="status"></p>
</form>
<script>
(function(){
var form=document.getElementById('email-form'),st=document.getElementById('form-status');
form.addEventListener('submit',function(ev){
ev.preventDefault();st.textContent='שולח...';
fetch('https://REPLACE-WITH-VERCEL-URL.vercel.app/api/send_plan_email',{method:'POST',headers:{'Content-Type':'application/json'},
body:JSON.stringify({email:form.email.value,plan_number:form.plan_number.value,
website:form.website.value})}).then(function(r){
st.textContent=r.ok?'אם הכתובת תקינה, המייל בדרך.':'לא ניתן לשלוח כרגע, נסו מאוחר יותר.';
}).catch(function(){st.textContent='לא ניתן לשלוח כרגע, נסו מאוחר יותר.';});
});
})();
</script>
