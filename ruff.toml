extend-exclude = ["scripts/security/scorecard_guard.py", "tests/security/test_scorecard_guard.py"]
target-version = "py310"

[lint]
extend-select = [
    # #111: complexity/length ratchet on top of ruff's default ruleset. New
    # or touched code must stay under these limits; existing violators are
    # grandfathered in per-file-ignores below and burn down over time (see
    # issue #111).
    "C901",
    "PLR0915",
    # #112: security rules, triaged. S101 (assert) is idiomatic pytest and
    # off for tests/**; S603/S607 are the VPN scripts' deliberate
    # subprocess use (cwd-controlled, never shell=True); the rest are
    # grandfathered per file below and burn down like #111.
    "S",
]

[lint.mccabe]
max-complexity = 10

[lint.pylint]
max-statements = 50

[lint.per-file-ignores]
# #112 triage: assert is pytest idiom; the other S codes that appear in
# tests today are grandfathered there, burning down per #112.
"tests/**" = ["S101", "S105", "S106", "S108", "S307", "S310", "S324", "S603", "S607"]

