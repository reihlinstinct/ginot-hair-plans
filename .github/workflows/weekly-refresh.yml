name: Weekly data refresh (iplan + land.gov.il)

# Fully automatic weekly refresh, no VPN and no agent trigger (issue #55):
#   1. scripts/land_feed.py - Israel Land Authority TabaSearch public API:
#      per-plan deposit-publication status + status date (the statutory
#      objection-clock start) for every plan in the table.
#   2. refresh.py - the iplan ArcGIS refresh; merges the land feed into
#      each row (deadline = latest publication + 60d, Planning and
#      Building Law s.102), rebuilds CSV/XLSX/snapshots and the Pages site.
# Changes are staged as a PR for independent review, exact-head Claude review
# and green CI. This fetch job never merges, updates branches, publishes Pages
# or advances the Cloudflare mirror. Reviewed manual post-merge continuation
# is documented in docs/operations/data-publication.md (issue #564).

on:
  schedule:
    - cron: "7 4 * * 2"   # Tuesdays 04:07 UTC (off-peak, weekly)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    if: ${{ vars.WEEKLY_REFRESH_ENABLED != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch land.gov.il deposit-publication status per plan
        run: python3 -u scripts/land_feed.py

      - name: Run iplan refresh and render the site
        run: python3 -u refresh.py

      - name: Publish changes as a PR for review
        env:
          # Repo-scoped PAT: a GITHUB_TOKEN-opened
          # PR never triggers ci.yml, so the required checks never ran and the
          # publication stalled. Opening as the PAT user fires
          # pull_request events normally.
          GH_TOKEN: ${{ secrets.REFRESH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "no changes this week"
            exit 0
          fi
          BRANCH="weekly-refresh/$(date +%Y%m%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -m feed-output
          git fetch origin main
          git reset --hard origin/main
          if ! git stash pop; then
            git checkout --theirs .
            git add -A
            git stash drop
          fi
          git checkout -b "$BRANCH"
          # Rebase/stash conflict recovery can preserve generated files from
          # an older source tree (#581). Render only after current main and
          # fetched data have been reconciled. No fresh municipal request.
          python3 scripts/ci/check_docs_fresh.py --include-data-json --write
          python3 scripts/ci/check_docs_fresh.py --include-data-json
          git add -A
          git commit -m "Weekly data refresh $(date +%Y-%m-%d) (refs #55)

          Automated weekly run: land.gov.il TabaSearch deposit-publication
          status feed + iplan refresh. Objection deadlines derived as
          latest publication + 60 days (s.102), sources kept per row."
          git push -u origin "$BRANCH"
          PR=$(gh pr create --title "Weekly data refresh $(date +%Y-%m-%d)" \
            --body "Automated weekly refresh (refs #55): land.gov.il publication-status feed + iplan refresh. Requires independent review, exact-head Claude review and green CI before manual merge." \
            --base main --head "$BRANCH")
          echo "opened $PR"
          echo "awaiting independent and exact-head Claude reviews: $PR"
          # PR creation is not publication. Preserve this branch and data;
          # reviewers merge normally, then request deployment separately.
