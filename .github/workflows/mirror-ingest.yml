name: Permit mirror ingest (over.org.il)

# Issue #74: bulk ingest of Jerusalem licensing case files from the
# over.org.il (גרסאות לעם) public mirror of the ykpubdata viewer -
# change detection and bulk layer with zero load on the municipality.
# The mirror's בעלי עניין personal-names column is dropped on ingest.
# MANUAL DISPATCH ONLY until a green manual run and owner sign-off,
# per the owner's schedule gate. The mirror carries no s.149
# publication dates; those stay with the direct scanner (permit-feed).

on:
  schedule:
    - cron: "20 3 * * *"   # nightly 03:20 UTC mirror-diff (owner-approved 2026-10-20)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror-ingest
  cancel-in-progress: false

jobs:
  pending:
    # #564: never stack a second data PR while one awaits review. Lists open
    # same-repo PRs with the mirror-ingest/ head prefix (paginated, forks ignored).
    # Pending -> green run with a skip notice; guard error -> red (fail closed).
    if: ${{ vars.MIRROR_INGEST_ENABLED != 'false' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pending: ${{ steps.guard.outputs.pending }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Check for a mirror-ingest/ data PR still awaiting review
        id: guard
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/ci/pending_data_pr.py --repo "$GITHUB_REPOSITORY" --prefix mirror-ingest/

      - name: Skip notice while a data PR awaits review
        if: ${{ steps.guard.outputs.pending == 'true' }}
        env:
          PENDING_PRS: ${{ steps.guard.outputs.pending_prs }}
        run: echo "::notice::data PR(s) $PENDING_PRS still await review; skipping this run (#564)"

  mirror-ingest:
    permissions:
      contents: write
    needs: pending
    if: ${{ vars.MIRROR_INGEST_ENABLED != 'false' && (needs.pending.outputs.pending == 'false') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"

      - name: Ingest mirror rows and validate against the direct scan
        env:
          PYTHONUNBUFFERED: "1"
        run: python3 scripts/mirror_ingest.py --validate-against data/permit_requests.json

      - name: Stage changes as a PR for review
        env:
          GH_TOKEN: ${{ secrets.REFRESH_DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          if git diff --quiet && git diff --cached --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "no mirror changes"
            exit 0
          fi
          BRANCH="mirror-ingest/$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git stash push --include-untracked -m mirror-output
          git fetch origin main
          git reset --hard origin/main
          if ! git stash pop; then
            git checkout --theirs .
            git add -A
            git stash drop
          fi
          git checkout -b "$BRANCH"
          python3 scripts/build_site_index.py || echo "site index rebuild failed (non-fatal)"
          git add data/ docs/index.json
          git commit -m "Permit mirror ingest $(date +%Y-%m-%d) (refs #74)

          Bulk ingest from the over.org.il public mirror of the ykpubdata
          licensing viewer, DRAFT-labelled; בעלי עניין personal data
          dropped on ingest. Third-party data - verify at source."
          git push -u origin "$BRANCH"
          PR=$(gh pr create --title "Permit mirror ingest $(date +%Y-%m-%d)" \
            --body "Automated mirror ingest (refs #74). DRAFT third-party mirror data; personal-names column dropped. Requires independent and exact-head Claude reviews, green CI and normal manual merge." \
            --base main --head "$BRANCH")
          echo "opened $PR"
          echo "awaiting independent and exact-head Claude reviews: $PR"
          # PR creation is not publication. Do not dispatch a successor until
          # a reviewed normal merge is confirmed (operations docs, #564/#565).

  summary:
    name: Run summary
    if: always()
    permissions:
      contents: read
    needs: [pending, mirror-ingest]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Write run summary
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/ci/run_summary.py
