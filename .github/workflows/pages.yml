name: Pages build and deploy

# Deploys the GitHub Pages site with a real build step (#959). The build job
# re-renders the site from committed inputs (check_docs_fresh.py --write
# --write-images), which draws the og preview PNGs from the committed data,
# and the deploy job publishes the rendered docs/ with actions/deploy-pages.
# Both jobs are gated to the main ref and to the PAGES_ACTIONS_DEPLOY repo
# variable, so nothing deploys (and no red run appears) until the owner
# flips the Pages source to GitHub Actions and sets that variable - both
# owner decisions taken at merge time (#959).

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main' && vars.PAGES_ACTIONS_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-pages.txt
      - run: pip install --require-hashes -r requirements-pages.txt
      - name: Render the site from committed inputs (writes docs/, incl. og PNGs)
        run: python3 scripts/ci/check_docs_fresh.py --include-data-json --write --write-images
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: docs/
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.PAGES_ACTIONS_DEPLOY == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - if: github.ref == 'refs/heads/main' && vars.PAGES_ACTIONS_DEPLOY == 'true'
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
