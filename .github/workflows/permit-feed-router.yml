name: Permit feed post-merge router (dry-run)

# #565: after a permit-feed/ data PR to main closes, decide from GitHub's own
# records (PR, #566 provenance at the exact head SHA, originating run, reviews,
# commit comparisons) whether its successors may start. v1 is DRY-RUN ONLY:
# it prints the verdict and dispatches nothing. Real dispatch needs separate
# owner approval (it would use an existing dispatch secret in this workflow).
# Never checks out or runs PR code, never reads the PR title or body.

on:
  # Read the router from the pre-merge base SHA, not github.sha, which can
  # include this merged PR. A data PR must not change the code that judges it.
  # Never check out PR head code or interpolate PR-controlled fields into run:.
  # No secret is used in v1; adding one needs separate approval and review.
  pull_request_target:
    types: [closed]
    branches: [main]

concurrency:
  group: permit-feed-router-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  route:
    if: ${{ github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'permit-feed/') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Decide (dry-run, no dispatch)
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          python3 scripts/ci/permit_router.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" | tee -a "$GITHUB_STEP_SUMMARY"
