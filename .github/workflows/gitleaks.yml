name: Gitleaks

# Credential-format scan on every push and PR (#1141). Free for a
# personal-account repo (no license key), read-only token, no PR comments, no
# artifact upload. gitleaks runs with --redact, so a finding names the rule,
# file and line but never the value. Config: .gitleaks.toml. Limits: a pull
# request is scanned by its commit range (first 30 commits only) and merge
# commits are skipped, so this is not a full-history audit.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  scan:
    name: gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml
          # Exact scanner version: the action default (8.24.3) ignores the
          # [[allowlists]] / targetRules blocks of .gitleaks.toml (8.25+).
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
          GITLEAKS_ENABLE_SUMMARY: "true"
