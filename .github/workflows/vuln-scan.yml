name: Vulnerability scan

on:
  pull_request:
  schedule:
    - cron: '56 5 * * 1'
  workflow_dispatch:

permissions: {}

jobs:
  scan-pr:
    if: github.event_name != 'schedule'
    permissions:
      contents: read
      pull-requests: read
    uses: reihlinstinct/dependency-inventory/.github/workflows/scan-reusable.yml@0159d9c329809a61dd00ece1f477458dcbf2b96e # v1.0.8
  scan-weekly:
    if: github.event_name == 'schedule'
    permissions:
      contents: read
    uses: reihlinstinct/dependency-inventory/.github/workflows/scan-reusable.yml@0159d9c329809a61dd00ece1f477458dcbf2b96e # v1.0.8
