name: Dependency review
# PR-time diff audit (#125): fails when a pull request introduces a package
# version with a known vulnerability. Default fail-on-severity is "low"
# (the strictest setting), so no configuration is needed.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  dependency-review:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          # Default fail_on_scopes is runtime-only; audit every scope.
          fail-on-scopes: runtime, development, unknown
