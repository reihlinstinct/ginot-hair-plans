name: CI
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -r requirements.txt ruff pytest-cov
      - run: ruff check src tests refresh.py
      - name: External reviews append-only guard
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "$BASE_REF"
          python scripts/ci/check_external_reviews.py --base FETCH_HEAD
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: Commit identity guard (issue #473)
        if: github.event_name == 'pull_request'
        run: |
          # The guard walks base..head, so depth-1 is not enough (empirically
          # verified: depth-1 checkout + depth-1 base fetch shows the guard
          # only 1 commit, passing vacuously). Fetch full history of both
          # ends; the script fails closed if a shallow boundary remains.
          # GitHub context arrives via env (template-injection hardening).
          git fetch --unshallow origin "$BASE_REF:base-ref" "+refs/pull/$PR_NUMBER/head:pr-head" \
            || git fetch --depth=500 origin "$BASE_REF:base-ref" "+refs/pull/$PR_NUMBER/head:pr-head"
          FORK_ARG=""
          if [ "$HEAD_REPO_FORK" = "true" ]; then
            FORK_ARG="--fork-author $PR_AUTHOR"
          fi
          python scripts/ci/check_commit_identities.py --base base-ref --head pr-head $FORK_ARG
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REPO_FORK: ${{ github.event.pull_request.head.repo.fork }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
      - run: python -m pytest -q --cov --cov-config=.coveragerc --cov-report=term --cov-report=json:coverage.json --junitxml=test-results.xml
      - name: Test run summary
        if: ${{ always() }}
        run: python scripts/ci/test_summary.py --junit test-results.xml --coverage coverage.json --title "Python ${{ matrix.python-version }}"
      - name: Publish measured main-only test badges
        if: ${{ success() && github.ref == 'refs/heads/main' && matrix.python-version == '3.12' }}
        run: |
          python3 scripts/ci/publish_badges.py python test-results.xml coverage.json /tmp/badges
          bash scripts/ci/push_badges.sh /tmp/badges
      # Coverage gate (issue #105). Report-only until .github/qa-gates.json
      # has "enforce": true - flipping that one value is the whole
      # November switch-on. The floor can only be raised.
      - name: Coverage gate
        run: |
          python3 - <<'PY'
          import json, sys
          gates = json.load(open(".github/qa-gates.json"))
          pct = json.load(open("coverage.json"))["totals"]["percent_covered"]
          floor = gates["coverage_floor"]
          print(f"coverage {pct:.1f}% (floor {floor}%, enforce={gates['enforce']})")
          if pct < floor:
              msg = f"coverage {pct:.1f}% is below the floor {floor}%"
              if gates["enforce"]:
                  sys.exit(msg)
              print("::warning::" + msg + " (report-only, gate not enforced yet)")
          PY
  worker:
    # Node tests for the Cloudflare API worker (worker/). Ubuntu ships Node.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: node --test --test-reporter=junit --test-reporter-destination=worker-results.xml worker/*.test.mjs
      - name: Test run summary
        if: ${{ always() }}
        run: python3 scripts/ci/test_summary.py --junit worker-results.xml --title "Worker tests"

  site-browser:
    # Headless browser tests of the built site (issues #106, #422). Separate job
    # so the 4-version test matrix does not each download a browser. Runs on
    # Chromium and WebKit; per-test evidence (screenshot always, video+trace on
    # failure or @pytest.mark.evidence) uploads as an artifact.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    env:
      SITE_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt playwright
      - run: python -m playwright install --with-deps ${{ matrix.browser }}
      - run: python -m pytest -q tests/test_site_browser.py tests/test_map_browser.py --junitxml=browser-results.xml
      - name: Test run summary
        if: ${{ always() }}
        run: python scripts/ci/test_summary.py --junit browser-results.xml --title "Browser tests (${{ matrix.browser }})"
      - name: Upload E2E evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-e2e-evidence-${{ matrix.browser }}
          path: tests/.artifacts/
          if-no-files-found: error
          include-hidden-files: true  # tests/.artifacts is a dot-dir (issue #426)
          retention-days: 30
